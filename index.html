<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player de teste para PS4</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#101114; color:#f4f4f5; font:18px Arial, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:22px; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:#c7c7cc; line-height:1.45; }
  .panel { background:#1b1d22; border:1px solid #343740; border-radius:12px; padding:18px; margin:16px 0; }
  button, input { font:inherit; border-radius:8px; padding:14px; }
  button { border:0; background:#e8e8eb; color:#111; font-weight:bold; margin:6px 6px 6px 0; }
  input { width:100%; background:#0e0f12; color:white; border:1px solid #555a66; margin:8px 0; }
  video { width:100%; max-height:62vh; background:#000; display:block; border-radius:10px; }
  #status { min-height:28px; color:#a9d5ff; }
  .hint { font-size:15px; color:#aeb1bb; }
</style>
</head>
<body>
<main>
  <h1>Player de teste — PS4</h1>
  <p>Use os botões com o controle do PS4. Primeiro teste a transmissão de demonstração.</p>

  <section class="panel">
    <video id="video" controls playsinline></video>
    <p id="status" role="status">Aguardando seleção.</p>
    <button id="test">▶ Testar vídeo gratuito</button>
    <button id="stop">■ Parar</button>
    <button id="fullscreen">Tela cheia</button>
  </section>

  <section class="panel">
    <strong>Testar outro endereço M3U8</strong>
    <input id="url" type="url" placeholder="Cole aqui um link terminado em .m3u8">
    <button id="play">Reproduzir endereço</button>
    <p class="hint">Este player não fornece canais. Ele apenas testa links de transmissão que você tenha autorização para assistir.</p>
  </section>
</main>
<script>
(function () {
  var video = document.getElementById('video');
  var status = document.getElementById('status');
  var testUrl = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';

  function playUrl(url) {
    if (!url) { status.textContent = 'Cole um endereço válido.'; return; }
    video.pause();
    video.removeAttribute('src');
    video.load();
    video.src = url;
    video.load();
    status.textContent = 'Carregando transmissão...';
    var result = video.play();
    if (result && result.catch) {
      result.catch(function () {
        status.textContent = 'Aperte PLAY no vídeo. Se não funcionar, o navegador pode não aceitar este formato.';
      });
    }
  }

  document.getElementById('test').onclick = function () { playUrl(testUrl); };
  document.getElementById('play').onclick = function () {
    playUrl(document.getElementById('url').value.trim());
  };
  document.getElementById('stop').onclick = function () {
    video.pause();
    video.removeAttribute('src');
    video.load();
    status.textContent = 'Reprodução parada.';
  };
  document.getElementById('fullscreen').onclick = function () {
    if (video.requestFullscreen) video.requestFullscreen();
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    else status.textContent = 'Tela cheia não está disponível neste navegador.';
  };
  video.addEventListener('playing', function () { status.textContent = 'Reproduzindo.'; });
  video.addEventListener('error', function () {
    status.textContent = 'Não foi possível reproduzir. Pode ser incompatibilidade do PS4 ou indisponibilidade do link.';
  });
})();
</script>
</body>
</html>
